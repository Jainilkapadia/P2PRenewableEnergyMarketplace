version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: p2p_energy_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: p2p_energy_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d p2p_energy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: p2p_energy_backend
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/p2p_energy_db"
      SECRET_KEY: "super-secret-jwt-key-for-local-hackathon-development"
      ENV: "development"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
